services:
  # Backend Web Service (Python/FastAPI)
  - type: web
    name: basim-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn src.api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: basim-redis
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: basim-redis
          property: connectionString
      - key: JOB_TTL_SECONDS
        value: "86400"
      - key: BASIM_FRONTEND_URL
        value: https://basim.innealta.com.au
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false

  # Frontend Static Site (vanilla multipage Vite)
  - type: web
    name: basim-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: NODE_VERSION
        value: "22.19.0"
      - key: VITE_API_URL
        fromService:
          type: web
          name: basim-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
        # Optional: Prefix with https:// if you construct the full URL in your frontend

  # Background Worker (Celery)
  - type: worker
    name: basim-compute-worker
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m celery -A src.worker.celery_app.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2}"

    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: basim-redis
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: basim-redis
          property: connectionString
      - key: JOB_TTL_SECONDS
        value: "86400"
      - key: CELERY_CONCURRENCY
        value: "2"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # Redis Broker
  - type: redis
    name: basim-redis
    ipAllowList: []
