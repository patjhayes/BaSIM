services:
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend:
    image: python:3.10-slim
    working_dir: /app
    command: >-
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - redis

  worker:
    image: python:3.10-slim
    working_dir: /app
    command: >-
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      python -m celery -A src.worker.celery_app.celery_app worker
      --loglevel=info --concurrency=$${CELERY_CONCURRENCY:-2}"
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - redis

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    env_file: .env
    ports:
      - "5174:5174"
    volumes:
      - .:/app
      - frontend-node-modules:/app/frontend/node_modules
    depends_on:
      - backend

volumes:
  redis-data:
  frontend-node-modules: